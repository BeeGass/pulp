  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Pulp Mill","applicationCategory":"DeveloperApplication","operatingSystem":"Any (browser with WebAssembly)","url":"https://pulp.onlygass.dev/mill","isPartOf":{"@type":"SoftwareApplication","name":"Pulp","url":"https://pulp.onlygass.dev"},"author":{"@type":"Person","name":"Bryan Gass","alternateName":"BeeGass"},"description":"In-browser Pulp mill: pack a local folder into one LLM-ready dump with WebAssembly. Files stay in the tab — nothing is uploaded."}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%238f8d87' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='%23b8461f' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/pulp.css">
  <link rel="stylesheet" href="/mill/mill.css">
  <link rel="modulepreload" href="/mill/mill.js">
  <link rel="modulepreload" href="/mill/pkg/pulp_wasm.js">
</head>
<body>
  <div id="mill"></div>
  <input id="dirInput" type="file" webkitdirectory multiple hidden>
  <input id="fileInput" type="file" multiple hidden>
  <noscript><p style="padding:24px">The browser mill needs JavaScript and WebAssembly. The CLI works without either: <code>cargo install --git https://github.com/BeeGass/pulp --locked</code></p></noscript>
  <script type="module">
    import init, { scan_files, pack_files, render_result, artifact_as, drop_result, preview_file, pulp_version, smoke_pack, format_tree } from '/mill/pkg/pulp_wasm.js';
    import { mountMill } from '/mill/mill.js';

    let version = 'unknown';
    const grant = { files: new Map(), label: '' };
    const ready = init().then(() => {
      version = pulp_version();
      const smoke = smoke_pack();
      if (!smoke || !(smoke.files_extracted > 0)) throw new Error('the in-browser packer failed its self-check');
    });

    function cancelled() {
      return Object.assign(new Error('cancelled'), { cancelled: true });
    }

    /* ---------- workers ----------
       Each pack runs in its own worker. The worker behind the dump on screen
       keeps that result, so a format change redraws it there and cancelling a
       newer pack never loses it. Previews share one more worker; they store
       nothing, but a failed preview replaces that worker so the next one
       starts clean. */
    function lane() {
      let worker = null;
      let seq = 0;
      const pending = new Map();
      const fail = (err) => {
        for (const job of pending.values()) job.reject(err);
        pending.clear();
      };
      function ensure() {
        if (worker) return worker;
        worker = new Worker('/mill/worker.js', { type: 'module' });
        worker.onmessage = (ev) => {
          const msg = ev.data || {};
          const job = pending.get(msg.id);
          if (!job) return;
          pending.delete(msg.id);
          if (msg.ok) job.resolve(msg.result);
          else job.reject(new Error(msg.error || 'the packer failed'));
        };
        worker.onerror = (ev) => {
          ev.preventDefault();
          worker.terminate();
          worker = null;
          fail(Object.assign(new Error(ev.message || 'the packer worker crashed'), { crashed: true }));
        };
        return worker;
      }
      return {
        idle: () => pending.size === 0,
        call(type, payload, transfer) {
          return new Promise((resolve, reject) => {
            let w;
            try {
              w = ensure();
            } catch (err) {
              reject(Object.assign(err, { crashed: true }));
              return;
            }
            const id = ++seq;
            pending.set(id, { resolve, reject });
            w.postMessage({ type, id, payload }, transfer || []);
          });
        },
        stop(err) {
          if (worker) worker.terminate();
          worker = null;
          fail(err || cancelled());
        },
      };
    }

    let jobLane = null;
    let resultLane = null;
    let mainResult = '';
    let previewLane = null;
    let cancelGen = 0;

    /** Pack in a worker; only a worker that cannot run falls back to this thread. */
    async function packOn(where, input) {
      try {
        const transfer = input.files.map((f) => f.bytes.buffer);
        return Object.assign(await where.call('pack', input, transfer), { via: 'worker' });
      } catch (err) {
        if (!err || !err.crashed) throw err;
        console.warn('packer worker unavailable, packing on the main thread', err);
        const files = await Promise.all(input.files.map(async (f) => {
          const blob = grant.files.get(f.relative);
          return Object.assign({}, f, { bytes: blob ? new Uint8Array(await blob.arrayBuffer()) : new Uint8Array(0) });
        }));
        return Object.assign(pack_files(Object.assign({}, input, { files })), { via: 'main' });
      }
    }

    /** Preview in its worker; only a worker that cannot run falls back to this thread. */
    async function previewOn(input, blob) {
      if (!previewLane) previewLane = lane();
      const where = previewLane;
      try {
        return await where.call('preview', input, [input.bytes.buffer]);
      } catch (err) {
        if (err && err.crashed) {
          console.warn('preview worker unavailable, previewing on the main thread', err);
          return preview_file(Object.assign({}, input, { bytes: new Uint8Array(await blob.arrayBuffer()) }));
        }
        // An extractor that failed mid-file can leave its WASM instance unusable.
        if (previewLane === where && where.idle()) {
          where.stop();
          previewLane = null;
        }
        throw err;
      }
    }

    /** Free the result on screen before a new one replaces it. */
    function retire() {
      if (resultLane) resultLane.stop();
      resultLane = null;
      if (mainResult) drop_result(mainResult);
      mainResult = '';
    }

    /* ---------- granting files ---------- */
    async function mapPool(items, limit, fn) {
      const out = new Array(items.length);
      let next = 0;
      async function run() {
        while (next < items.length) {
          const i = next++;
          out[i] = await fn(items[i], i);
        }
      }
      await Promise.all(Array.from({ length: Math.min(limit, Math.max(1, items.length)) }, run));
      return out;
    }

    /** Replace the grant only when the new selection has files in it. */
    function take(entries, label) {
      const next = new Map();
      for (const e of entries) {
        const rel = String(e.relative || '').replace(/^\.?\//, '');
        if (rel) next.set(rel, e.file);
      }
      if (!next.size) return { cancelled: true, empty: true };
      grant.files = next;
      grant.label = label + ' · ' + next.size + (next.size === 1 ? ' file' : ' files') + ' in this tab';
      return { label: grant.label };
    }

    let settlePick = null;

    /**
     * Resolve with the chosen files, null on cancel, or undefined when a newer
     * pick replaces this one. Only real change/cancel events settle it: Chrome
     * asks "Upload N files?" after the folder dialog closes, so focus is no
     * signal that the pick is over.
     */
    function pick(input) {
      if (settlePick) settlePick(undefined);
      return new Promise((resolve) => {
        const finish = (files) => {
          input.removeEventListener('change', onChange);
          input.removeEventListener('cancel', onCancel);
          if (settlePick === finish) settlePick = null;
          resolve(files);
        };
        const onChange = () => finish([...input.files]);
        const onCancel = () => finish(null);
        settlePick = finish;
        input.value = '';
        input.addEventListener('change', onChange);
        input.addEventListener('cancel', onCancel);
        input.click();
      });
    }

    function folderLabel(files) {
      const first = files.find((f) => f.webkitRelativePath);
      return first ? first.webkitRelativePath.split('/')[0] : 'chosen files';
    }

    function readEntries(reader) {
      return new Promise((resolve, reject) => reader.readEntries(resolve, reject));
    }

    async function walkEntry(entry, out) {
      if (entry.isFile) {
        const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
        out.push({ relative: entry.fullPath.replace(/^\//, ''), file });
        return;
      }
      if (!entry.isDirectory) return;
      const reader = entry.createReader();
      for (;;) {
        const batch = await readEntries(reader);
        if (!batch.length) break;
        for (const child of batch) await walkEntry(child, out);
      }
    }

    function fromBase64(text) {
      const bin = atob(text);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    /* ---------- packing ---------- */
    function packInput(r, files, selected) {
      return {
        files,
        selected,
        format: r.format,
        archives: r.archives,
        binaries: false,
        notebook_outputs: r.notebook,
        source: r.source,
        hidden: r.hidden,
        no_tree: !r.tree,
        exclude: [],
      };
    }

    async function readSelected(r, onProgress, gen) {
      const jobs = [];
      for (const id of r.selected) if (grant.files.has(id)) jobs.push([id, grant.files.get(id)]);
      if (!jobs.length) throw new Error('none of the ticked files can be read in this tab any more; choose the folder again');
      let done = 0;
      return mapPool(jobs, 8, async ([relative, file]) => {
        if (gen !== cancelGen) throw cancelled();
        const bytes = new Uint8Array(await file.arrayBuffer());
        done++;
        if (onProgress && gen === cancelGen) onProgress(done, jobs.length);
        return { relative, id: relative, bytes };
      });
    }

    function normalize(d, via) {
      return {
        dump: d.dump || '',
        filename: d.filename || 'pulp-browser.xml',
        dumpBytes: d.dump_bytes || 0,
        filesExtracted: d.files_extracted || 0,
        filesSkipped: d.files_skipped || 0,
        tokens: d.tokens_est || 0,
        elapsedMs: d.elapsed_ms || 0,
        truncated: !!d.truncated,
        cancelled: !!d.cancelled,
        previewTruncated: !!d.preview_truncated,
        resultId: d.result_id || '',
        outcomes: d.outcomes || [],
        error: d.error || '',
        via,
      };
    }

    function renderInput(resultId, r) {
      return { result_id: resultId, format: r.format, no_tree: !r.tree };
    }

    const mill = mountMill(document.getElementById('mill'), {
      surface: 'browser',
      surfaceName: 'browser mill',
      version: () => version,
      homeHref: '/',
      privacy: 'files stay in this tab',
      privacyLong: 'Files stay in this tab. Nothing is uploaded; packing runs in WebAssembly on this device.',
      footer: 'wasm · runs in this tab',
      caps: { source: 'grant', pickFiles: true, drop: true, gitignore: false, rerender: true, sample: true, progress: true },
      async browse() {
        const files = await pick(document.getElementById('dirInput'));
        if (files === undefined) return undefined;
        if (!files) return { cancelled: true };
        return take(files.map((file) => ({ relative: file.webkitRelativePath || file.name, file })), folderLabel(files));
      },
      async pickFiles() {
        const files = await pick(document.getElementById('fileInput'));
        if (files === undefined) return undefined;
        if (!files) return { cancelled: true };
        return take(files.map((file) => ({ relative: file.name, file })), 'chosen files');
      },
      drop(dataTransfer) {
        const entries = [...(dataTransfer.items || [])]
          .map((item) => (item.webkitGetAsEntry ? item.webkitGetAsEntry() : null))
          .filter(Boolean);
        const loose = [...(dataTransfer.files || [])];
        const takeLoose = () => take(loose.map((file) => ({ relative: file.name, file })), 'dropped files');
        return (async () => {
          if (!entries.length) return takeLoose();
          const dirs = entries.filter((e) => e.isDirectory).map((e) => e.name);
          const out = [];
          try {
            for (const entry of entries) await walkEntry(entry, out);
          } catch (err) {
            // WebKit cannot open entries for files that have no path on disk, but
            // it still lists them in dataTransfer.files. A folder has no such fallback.
            if (dirs.length || !loose.length) throw err;
            return takeLoose();
          }
          if (!out.length && !dirs.length && loose.length) return takeLoose();
          return take(out, dirs.length === 1 && entries.length === 1 ? dirs[0] : 'dropped files');
        })();
      },
      async sample() {
        const res = await fetch('/mill/sample.json');
        if (!res.ok) throw new Error('could not fetch the sample (' + res.status + ')');
        const bundle = await res.json();
        const entries = bundle.files.map((f) => {
          const bytes = f.base64 != null ? fromBase64(f.base64) : new TextEncoder().encode(f.text);
          return { relative: bundle.name + '/' + f.path, file: new File([bytes], f.path.split('/').pop()) };
        });
        return take(entries, bundle.name + ' (sample)');
      },
      async scan(o) {
        await ready;
        const metas = [...grant.files.entries()].map(([relative, file]) => ({ relative, size: file.size }));
        const opts = { hidden: o.hidden, archives: o.archives, exclude: [] };
        let data = scan_files(Object.assign({ files: metas }, opts));
        const unknown = (data.files || []).filter((f) => f.kind === 'unknown');
        if (unknown.length) {
          const heads = await mapPool(unknown, 24, async (f) => {
            const file = grant.files.get(f.relative);
            const buf = file ? await file.slice(0, 8192).arrayBuffer() : new ArrayBuffer(0);
            return { relative: f.relative, size: f.size || 0, head: new Uint8Array(buf) };
          });
          const byRel = new Map(heads.map((h) => [h.relative, h]));
          data = scan_files(Object.assign({ files: metas.map((m) => byRel.get(m.relative) || m) }, opts));
        }
        return { files: data.files || [], bytes: data.bytes || 0, truncated: !!data.truncated, label: grant.label };
      },
      async pack(r, hooks) {
        const gen = cancelGen;
        await ready;
        if (gen !== cancelGen) throw cancelled();
        const files = await readSelected(r, hooks && hooks.onProgress, gen);
        if (gen !== cancelGen) throw cancelled();
        // The files are read; the worker extracts them in one call, so the bar
        // turns indeterminate rather than sitting full.
        if (hooks && hooks.onProgress) hooks.onProgress(0, 0);
        const job = lane();
        jobLane = job;
        let out;
        try {
          out = await packOn(job, packInput(r, files, files.map((f) => f.id)));
        } catch (err) {
          job.stop();
          throw err;
        } finally {
          if (jobLane === job) jobLane = null;
        }
        if (gen !== cancelGen) {
          job.stop();
          throw cancelled();
        }
        retire();
        if (out.via === 'worker') {
          resultLane = job;
        } else {
          job.stop();
          mainResult = out.result_id;
        }
        return normalize(out, out.via);
      },
      async render(r) {
        await ready;
        const input = renderInput(r.resultId, r);
        if (mainResult && mainResult === r.resultId) return normalize(render_result(input), 'main');
        if (!resultLane) throw new Error('the dump is no longer in memory; pulp again');
        return normalize(await resultLane.call('render', input), 'worker');
      },
      async preview(file, r) {
        await ready;
        const blob = grant.files.get(file.relative);
        if (!blob) throw new Error('this file is no longer available in the tab');
        const out = await previewOn({
          relative: file.relative,
          bytes: new Uint8Array(await blob.arrayBuffer()),
          source: r.source,
          notebook_outputs: r.notebook,
          archives: r.archives,
          hidden: r.hidden,
        }, blob);
        return { text: out.text || '', truncated: !!out.truncated, status: out.status, message: out.message };
      },
      async tree(r) {
        await ready;
        const paths = r.selected.filter((id) => grant.files.has(id));
        const text = format_tree({ paths, format: r.format });
        return { text, filename: 'pulp-tree.' + r.format };
      },
      async fullDump(res, r) {
        const input = renderInput(res.resultId, r);
        if (mainResult && mainResult === res.resultId) return artifact_as(input);
        if (!resultLane) throw new Error('the full dump is no longer in memory; pulp again');
        return resultLane.call('artifact_as', input);
      },
      async cancel() {
        cancelGen++;
        if (jobLane) jobLane.stop();
        jobLane = null;
      },
    });

    ready.catch((err) => {
      console.error('pulp wasm failed to load', err);
      mill.showError('The in-browser packer failed to load.', (err && err.message ? err.message : String(err)) +
        '\nReload the page. If it keeps failing, your browser may block WebAssembly here; the CLI works everywhere.', true);
    });
  </script>
</body>
</html>
