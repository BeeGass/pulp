[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Per-machine / per-OS pulp build operator"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# Already in the lockfile through tokio's signal support; ui-test uses them to
# catch Ctrl-C and to stop Chrome and its helpers.
libc = "0.2.189"
signal-hook-registry = "1.4.8"
