[package]
name = "pulp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pulp a local folder of mixed documents into one LLM-ready text file"
repository = "https://github.com/BeeGass/pulp"
homepage = "https://github.com/BeeGass/pulp"
readme = "README.md"
authors = ["Bryan Gass"]
keywords = ["llm", "prompt", "text", "extract", "cli"]
categories = ["command-line-utilities", "text-processing"]
rust-version = "1.85"

[lib]
name = "pulp"
path = "src/lib.rs"

[[bin]]
name = "pulp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json"] }
calamine = "0.36.1"
chardetng = "1.0.0"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
csv = "1.4.0"
encoding_rs = "0.8.41"
flate2 = "1.1.10"
globset = "0.4.20"
html2text = "0.17.1"
ignore = "0.4.33"
infer = "0.22.0"
opener = "0.8.5"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
rayon = "1.12.0"
rtf-parser = { version = "0.4.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
