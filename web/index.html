<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ebe9e3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>pulp mill</title>
  <meta name="pulp-token" content="__PULP_TOKEN__">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%238f8d87' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='%23b8461f' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/pulp.css">
  <link rel="stylesheet" href="/mill.css">
</head>
<body>
  <div id="mill"></div>
  <noscript><p style="padding:24px">The pulp mill needs JavaScript. The CLI works without it: <code>pulp -o dump.xml .</code></p></noscript>
  <script type="module">
    import { mountMill } from '/mill.js';

    const TOKEN = document.querySelector('meta[name="pulp-token"]').content;
    const VERSION = '__PULP_VERSION__';
    let manifestId = '';

    /** A page left open while the mill restarted holds a stale session token. */
    function staleSession() {
      return Object.assign(new Error('This page belongs to a mill session that has ended. Open the new link that pulp ui printed to reconnect.'), { reload: true });
    }

    async function api(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-pulp-token': TOKEN },
        body: JSON.stringify(body),
      });
      if (res.status === 204) return {};
      if (res.status === 401) throw staleSession();
      const json = await res.json().catch(() => ({}));
      if (res.status === 429) {
        const what = url === '/api/preview' ? 'preview' : 'pack';
        throw Object.assign(new Error('Another ' + what + ' is running. Try again when it finishes.'), { busy: true });
      }
      // A 4xx answer is about the request (a folder that does not exist, say),
      // not a bug in pulp, so the mill shows it without offering a report.
      if (!res.ok) throw Object.assign(new Error(json.error || res.statusText), { user: res.status < 500 });
      return json;
    }

    /** Report the running pack's progress every 250 ms until the returned stop is called. */
    function watchProgress(onProgress) {
      if (!onProgress) return () => {};
      let live = true;
      let timer = 0;
      const poll = async () => {
        try {
          const res = await fetch('/api/progress', { headers: { 'x-pulp-token': TOKEN } });
          const p = res.ok ? await res.json() : null;
          if (live && p && p.running && p.total) onProgress(p.done, p.total);
        } catch (_) {
          // A missed poll only delays the next update.
        }
        if (live) timer = setTimeout(poll, 250);
      };
      timer = setTimeout(poll, 250);
      return () => {
        live = false;
        clearTimeout(timer);
      };
    }

    function request(r) {
      return {
        path: r.path,
        selected: r.selected,
        format: r.format,
        source: r.source,
        no_tree: !r.tree,
        notebook_outputs: r.notebook,
        archives: r.archives,
        hidden: r.hidden,
        gitignore: r.gitignore,
        manifest_id: manifestId,
        result_id: r.resultId,
      };
    }

    function result(d) {
      if (d.manifest_id) manifestId = d.manifest_id;
      return {
        dump: d.dump || '',
        filename: d.filename || 'pulp.xml',
        dumpBytes: d.dump_bytes || 0,
        filesExtracted: d.files_extracted || 0,
        filesSkipped: d.files_skipped || 0,
        tokens: d.tokens_est || 0,
        elapsedMs: d.elapsed_ms || 0,
        truncated: !!d.truncated,
        cancelled: !!d.cancelled,
        previewTruncated: !!d.preview_truncated,
        resultId: d.result_id || '',
        outcomes: d.outcomes || [],
      };
    }

    mountMill(document.getElementById('mill'), {
      surface: 'local',
      surfaceName: 'local mill',
      version: VERSION,
      privacy: 'nothing leaves this machine',
      privacyLong: 'Files never leave this machine. The mill listens on 127.0.0.1 only.',
      footer: 'pulp ' + VERSION + ' · ' + location.host,
      caps: { source: 'path', gitignore: true, rerender: true, sample: true, progress: true },
      async browse() {
        const d = await api('/api/browse', {});
        return d.cancelled || !d.path ? { cancelled: true } : { path: d.path };
      },
      async sample() {
        const d = await api('/api/sample', {});
        // The field names the sample, not the private temp folder it was written to.
        const name = String(d.path || '').split(/[\\/]/).filter(Boolean).pop() || 'sample';
        return { path: d.path, display: name + ' (sample)', sample: true };
      },
      async scan(o) {
        const d = await api('/api/scan', { path: o.path, gitignore: o.gitignore, hidden: o.hidden, archives: o.archives });
        manifestId = d.manifest_id || '';
        return { files: d.files || [], bytes: d.bytes || 0, truncated: !!d.truncated };
      },
      async pack(r, hooks) {
        const stop = watchProgress(hooks && hooks.onProgress);
        try {
          return result(await api('/api/pack', request(r)));
        } finally {
          stop();
        }
      },
      async render(r) {
        return result(await api('/api/render', request(r)));
      },
      async preview(file, r) {
        const d = await api('/api/preview', Object.assign(request(r), { selected: [file.id || file.relative] }));
        return { text: d.text || '', truncated: !!d.truncated, status: d.status, message: d.message };
      },
      async tree(r) {
        const d = await api('/api/tree', request(r));
        return { text: d.tree, filename: d.filename };
      },
      async fullDump(res, r) {
        const q = '?format=' + encodeURIComponent(r.format) + (r.tree ? '' : '&no_tree=true');
        const out = await fetch('/api/artifact/' + encodeURIComponent(res.resultId) + q, { headers: { 'x-pulp-token': TOKEN } });
        if (out.status === 401) throw staleSession();
        if (!out.ok) throw Object.assign(new Error('could not fetch the full dump (' + out.status + ')'), { user: out.status < 500 });
        return out.text();
      },
      async cancel() {
        await api('/api/cancel', {});
      },
    });
  </script>
</body>
</html>
